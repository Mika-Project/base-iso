i18n:
     name: "Finalizing Mika Linux Installation"

dontChroot: false
timeout: 999
script:
     - command: "sed -i '1,3d' /etc/sddm.conf.d/kde_settings.conf"
     - command: "sed -i '1s/.*/%wheel ALL=(ALL:ALL) ALL/' /etc/sudoers.d/g_wheel"
     - command: "chmod +x /usr/local/bin/script.sh"
     - command: "chmod +x /usr/share/applications/mika-system-updater.desktop"
     - command: "chmod -R 755 /usr/local/bin/mikadiagnostic/"
     - command: "chmod +x /usr/local/bin/mikadiagnostic/mikarun.sh"
     - command: "chmod +x /usr/share/applications/mikadiagnostic.desktop"
     - command: |
          cat <<'EOF' > /etc/lsb-release
          DISTRIB_ID="Mika Linux"
          DISTRIB_RELEASE="rolling"
          DISTRIB_DESCRIPTION="Mika Linux"
          DISTRIB_CODENAME="rolling"
          EOF
