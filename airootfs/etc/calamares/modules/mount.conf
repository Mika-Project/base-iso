extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    # ROOT CAUSE of the install abort "==> ERROR: '/dev' must be mounted!":
    # Calamares' mount module does `",".join(partition["options"])`
    # (calamares 3.4.0 modules/mount/main.py:90, get_mount_options). That only
    # works when `options` is a YAML *list*. This entry previously read
    # `options: bind` as a scalar *string*, so the join iterated its characters
    # into "b,i,n,d"; /dev was then mounted with garbage options and FAILED, so
    # /dev was never mounted. mkinitcpio gates the build on `[[ -e /dev/fd ]]`
    # (mkinitcpio:1051) and aborted with "/dev must be mounted!". proc/sys above
    # mount fine because they carry no `options` key (they fall back to
    # "defaults") — which is exactly why only /dev failed, not /proc. A correct
    # `--bind /dev` builds the initramfs fine (verified headlessly), so the fix
    # is purely the list form below. NOT a VM-only problem; it fails the same on
    # real hardware. (Same scalar bug was on /run/udev — fixed there too.)
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]

extraMountsEfi:
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars

btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /root
      subvolume: /@root
    - mountPoint: /srv
      subvolume: /@srv      
    - mountPoint: /var/cache
      subvolume: /@cache
    - mountPoint: /var/log
      subvolume: /@log
    - mountPoint: /var/tmp
      subvolume: /@tmp   

btrfsSwapSubvol: /@swap
