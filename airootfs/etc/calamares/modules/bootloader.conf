efiBootLoader: "grub"

kernel: "_ALL_kver_"
img: "_default_image_"
fallback: "_fallback_image_"
timeout: "10"

# Use the Mika wrapper: it adds --no-nvram for UEFI so grub-install doesn't fail
# when efibootmgr can't write EFI NVRAM (VMs / locked firmware). installEFIFallback
# below then writes the bootable /EFI/BOOT/BOOTX64.EFI path.
grubInstall: "/usr/local/bin/mika-grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEFIFallback: true
